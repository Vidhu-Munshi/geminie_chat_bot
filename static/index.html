<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ByteBaaz — Gemini Chatbot</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div>
          <p class="eyebrow">Gemini-backed lab mentor</p>
          <h1>ByteBaaz</h1>
        </div>
        <button id="new-chat" type="button">New chat</button>
      </header>
      <section id="log" class="log" aria-live="polite"></section>
      <p id="status" class="status" hidden></p>
      <form id="composer">
        <label class="sr-only" for="message">Message</label>
        <textarea
          id="message"
          name="message"
          rows="2"
          required
          placeholder="Ask ByteBaaz something — then keep going for 5+ turns to test memory."
        ></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
